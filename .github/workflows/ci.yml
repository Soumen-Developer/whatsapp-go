name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.24"
  GO_VERSION_LATEST: "1.25"

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ["1.23", "1.24", "1.25"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Windows doesn't support race detector with cgo
          - go-version: "1.25"
            os: windows-latest
          - go-version: "1.24"
            os: windows-latest
          - go-version: "1.23"
            os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test ./... -coverprofile=coverage.txt -covermode=atomic
          elif [ "${{ matrix.go-version }}" = "1.25" ]; then
            go test ./... -race -coverprofile=coverage.txt -covermode=atomic
          else
            go test ./... -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./...
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64

      - name: Run linters
        run: golangci-lint run ./... --timeout=10m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build main package
        run: go build -v ./...

      - name: Build examples (if any)
        if: ${{ hashFiles('examples/**/main.go') != '' }}
        run: go build -v ./examples/...

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-go-${{ github.sha }}
          path: |
            whatsapp-go*
            whatsapp-go*.exe
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -exclude=G104,G107,G115,G204,G301,G304,G306,G307,G401,G404 ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  tidy:
    name: Go Mod Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  integration:
    name: Integration Test (Manual)
    runs-on: ubuntu-latest
    if: false  # Only run manually via workflow_dispatch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration tests
        run: go test -tags=integration ./... -v -count=1
        env:
          WHATSAPP_TEST_DEVICE: ${{ secrets.WHATSAPP_TEST_DEVICE }}
          WHATSAPP_TEST_DB: ${{ secrets.WHATSAPP_TEST_DB }}

  # Summary job to show overall status
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, lint, build, security, tidy]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "Test: ${{ needs.test.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Tidy: ${{ needs.tidy.result }}"
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.security.result }}" != "success" || "${{ needs.tidy.result }}" != "success" ]]; then
            echo "::error::Some CI jobs failed"
            exit 1
          fi